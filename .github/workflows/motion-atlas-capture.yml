name: Build Motion Atlas comparison videos
on:
  push:
    branches:
      - codex/motion-atlas-side-by-side-20261122
    paths:
      - .github/workflows/motion-atlas-capture.yml
      - shorts-lab.test.cjs
      - tools/capture-motion-atlas.py
      - tools/resolve-motion-videos.py
      - kits/shorts-lab/lab.mjs
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: motion-atlas-capture
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - name: Checkout review branch
        uses: actions/checkout@v4
        with:
          ref: codex/motion-atlas-side-by-side-20261122
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser, metadata and encoding tools
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          python -m pip install playwright yt-dlp
          python -m playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Qualify existing static gallery
        run: |
          node --test shorts-lab.test.cjs
          node --test *.test.cjs quote/*.test.cjs
      - name: Recover prior verified 61 captures and video metadata
        uses: actions/download-artifact@v4
        with:
          name: motion-atlas-capture-diagnostics
          run-id: 45053261253
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: kits/shorts-lab
      - name: Confirm recovered captures
        run: |
          python - <<'PY'
          from pathlib import Path
          files=list(Path('kits/shorts-lab/assets').glob('[0-9][0-9][0-9].mp4'))
          print('Recovered',len(files),'MP4s')
          assert len(files)==61
          PY
      - name: Capture corrected study 002 in real Chromium
        timeout-minutes: 5
        run: |
          python tools/capture-motion-atlas.py --ids 2
      - name: Validate and index all verified clips
        timeout-minutes: 8
        run: |
          python tools/capture-motion-atlas.py
      - name: Verify all 62 local MP4s and manifest integrity
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          root=Path('kits/shorts-lab/assets')
          found=sorted(root.glob('[0-9][0-9][0-9].mp4'))
          print('video count:',len(found),'bytes:',sum(p.stat().st_size for p in found))
          assert len(found)==62, f'Expected 62 video clips, only {len(found)}'
          content=Path('kits/shorts-lab/clip-manifest.mjs').read_text()
          for file in found:
              assert './assets/'+file.name in content
          PY
          node --test shorts-lab.test.cjs
          node --test *.test.cjs quote/*.test.cjs
      - name: Commit verified comparison video assets to the draft PR branch
        run: |
          set -euxo pipefail
          git config user.name "motion-atlas-capture[bot]"
          git config user.email "motion-atlas-capture[bot]@users.noreply.github.com"
          git add kits/shorts-lab/assets/ kits/shorts-lab/clip-manifest.mjs
          git add kits/shorts-lab/resolved-videos.mjs
          if test -f kits/shorts-lab/video-link-resolution.json; then git add kits/shorts-lab/video-link-resolution.json; fi
          git diff --cached --check
          git commit -m "Add 62 verified browser-recorded Motion Atlas MP4 comparisons"
          git push origin HEAD:codex/motion-atlas-side-by-side-20261122
      - name: Upload captures if branch write is blocked
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: motion-atlas-capture-diagnostics
          path: |
            kits/shorts-lab/assets/
            kits/shorts-lab/clip-manifest.mjs
            kits/shorts-lab/resolved-videos.mjs
            kits/shorts-lab/video-link-resolution.json
          retention-days: 7
