name: Skill parity
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate skill inventory, links and reviewed capability changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node tools/check-skill-parity.mjs "$BASE_SHA"
