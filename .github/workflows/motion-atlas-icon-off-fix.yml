name: Verify and repair Motion Atlas icon off state
on:
  push:
    branches:
      - fix/motion-atlas-icon-off-state-20261122
    paths:
      - .github/workflows/motion-atlas-icon-off-fix.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: motion-atlas-icon-off-repair
  cancel-in-progress: false

jobs:
  check-and-capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout isolated fix
        uses: actions/checkout@v4
        with:
          ref: fix/motion-atlas-icon-off-state-20261122
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium, WebKit, and encoding tools
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium webkit
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Regress the existing kit and customer demos
        run: node --test *.test.cjs quote/*.test.cjs
      - name: Test on-off-hover-repeat on simulated iPhone Chromium and WebKit
        run: python tools/verify-icon-touch-state.py
      - name: Regenerate real off/on clip for study 071 only
        run: python tools/capture-motion-atlas.py --ids 71 --force
      - name: Validate existing full manifest and regenerated MP4
        run: |
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          root=Path('kits/shorts-lab/assets')
          files=list(root.glob('[0-9][0-9][0-9].mp4'))
          assert len(files)==62, len(files)
          manifest=Path('kits/shorts-lab/clip-manifest.mjs').read_text()
          assert manifest.count('"kind": "browser-recorded"')==62
          path=root/'071.mp4'
          proc=subprocess.run(['ffmpeg','-v','error','-i',str(path),'-f','framemd5','-'],check=True,capture_output=True,text=True)
          hashes=[x.rsplit(',',1)[-1].strip() for x in proc.stdout.splitlines() if x and not x.startswith('#')]
          print('Study 071: total frames',len(hashes),'distinct',len(set(hashes)),'bytes',path.stat().st_size)
          assert len(hashes)>=15 and len(set(hashes))>=3
          PY
      - name: Save corrected MP4 on review branch
        run: |
          git config user.name "motion-atlas-capture[bot]"
          git config user.email "motion-atlas-capture[bot]@users.noreply.github.com"
          git add kits/shorts-lab/assets/071.mp4 kits/shorts-lab/clip-manifest.mjs
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "Update icon comparison video to show complete off state"
            git push origin HEAD:fix/motion-atlas-icon-off-state-20261122
          fi
      - name: Save diagnostics if a check fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: icon-touch-fix-diagnostics
          path: kits/shorts-lab/assets/071.mp4
          retention-days: 7
