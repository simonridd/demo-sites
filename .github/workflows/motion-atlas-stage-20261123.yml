name: Motion Atlas final ImageKit avatar pilot and 80-study release
on:
  push:
    branches:
      - fix/motion-atlas-ambient-gemini-20261123
    paths:
      - .github/workflows/motion-atlas-stage-20261123.yml
      - shorts-lab.test.cjs
      - kits/shorts-lab/lab.css
      - kits/shorts-lab/lab.mjs
      - tools/verify-motion-atlas-stage-20261123.py
      - tools/capture-motion-atlas.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: motion-atlas-ticket-ambient-20261123
  cancel-in-progress: true

jobs:
  qualify-and-film:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout verified review branch
        uses: actions/checkout@v4
        with:
          ref: fix/motion-atlas-ambient-gemini-20261123
          persist-credentials: true
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium and encoder for source-faithful MP4 capture
        run: |
          set -euxo pipefail
          python -m pip install playwright
          python -m playwright install --with-deps chromium webkit
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Run full repository suite
        run: node --test *.test.cjs quote/*.test.cjs
      - name: Run mobile Chromium and WebKit acceptance for all 80 studies
        run: python tools/verify-motion-atlas-stage-20261123.py
      - name: Record corrected Gemini ambient and ImageKit avatar study
        run: python tools/capture-motion-atlas.py --force --ids 66 80
      - name: Verify 67 visual MP4s, corrected Gemini and avatar recordings
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          directory=Path('kits/shorts-lab/assets')
          vids=sorted(directory.glob('[0-9][0-9][0-9].mp4'))
          assert len(vids)==67, len(vids)
          manifest=Path('kits/shorts-lab/clip-manifest.mjs').read_text()
          assert manifest.count('"kind": "browser-recorded"')==67
          for idx in (66,80):
              file=directory/f'{idx:03d}.mp4'
              result=subprocess.run(['ffmpeg','-hide_banner','-loglevel','error','-i',str(file),'-f','framemd5','-'],
                capture_output=True,text=True,check=True)
              hashes=[row.rsplit(',',1)[-1].strip() for row in result.stdout.splitlines() if row and not row.startswith('#')]
              print(idx,'frames',len(hashes),'distinct',len(set(hashes)),'bytes',file.stat().st_size)
              assert len(hashes)>=15 and len(set(hashes))>=3
              assert f'./assets/{idx:03d}.mp4' in manifest
          PY
      - name: Run all regressions against new manifest
        run: node --test *.test.cjs quote/*.test.cjs
      - name: Commit only the new avatar recording and manifest
        run: |
          set -euxo pipefail
          git config user.name "motion-atlas-capture[bot]"
          git config user.email "motion-atlas-capture[bot]@users.noreply.github.com"
          git add kits/shorts-lab/assets/066.mp4 kits/shorts-lab/assets/080.mp4 kits/shorts-lab/clip-manifest.mjs
          git diff --cached --check
          git commit -m "Refresh Gemini ambient and add real ImageKit avatar recording"
          git fetch origin fix/motion-atlas-ambient-gemini-20261123
          git rebase origin/fix/motion-atlas-ambient-gemini-20261123
          git push origin HEAD:fix/motion-atlas-ambient-gemini-20261123
      - name: Preserve failed capture files
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ticket-and-ambient-diagnostics
          path: |
            kits/shorts-lab/assets/066.mp4
            kits/shorts-lab/assets/080.mp4
            kits/shorts-lab/clip-manifest.mjs
          retention-days: 7
