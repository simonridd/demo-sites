name: Refresh screenshot-led Motion Atlas studies
on:
  push:
    branches:
      - codex/motion-atlas-carousel-focus-20261122
    paths:
      - .github/workflows/motion-atlas-four-studies.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: motion-atlas-screenshot-studies
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/motion-atlas-carousel-focus-20261122
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chrome automation and MP4 tools
        run: |
          set -euxo pipefail
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Verify complete suite before recording
        run: |
          node --test *.test.cjs quote/*.test.cjs
      - name: Record only the four screenshot-refined live effects
        run: |
          python tools/capture-motion-atlas.py --force --ids 71 72 73 74
      - name: Check each recording actually changes frames and retains all 62 videos
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path
          assets=Path('kits/shorts-lab/assets')
          files=sorted(assets.glob('[0-9][0-9][0-9].mp4'))
          assert len(files)==62,(len(files),'expected 62')
          manifest=Path('kits/shorts-lab/clip-manifest.mjs').read_text()
          for n in [71,72,73,74]:
              path=assets/f'{n:03d}.mp4'
              assert path.exists()
              assert './assets/'+path.name in manifest
              probe=subprocess.run(['ffmpeg','-hide_banner','-loglevel','error','-i',str(path),'-f','framemd5','-'],capture_output=True,text=True,check=True)
              frame_hashes=[line.rsplit(',',1)[-1].strip() for line in probe.stdout.splitlines() if line and not line.startswith('#')]
              print(n,'frames',len(frame_hashes),'distinct',len(set(frame_hashes)),'bytes',path.stat().st_size)
              assert len(frame_hashes)>=15
              assert len(set(frame_hashes))>=3,f'study {n}: recording did not capture enough visible motion'
          PY
      - name: Run regression suite again with refreshed clips
        run: node --test *.test.cjs quote/*.test.cjs
      - name: Commit only the refreshed assets and generated manifest
        run: |
          set -euxo pipefail
          git config user.name "motion-atlas-capture[bot]"
          git config user.email "motion-atlas-capture[bot]@users.noreply.github.com"
          git add kits/shorts-lab/assets/071.mp4 kits/shorts-lab/assets/072.mp4 kits/shorts-lab/assets/073.mp4 kits/shorts-lab/assets/074.mp4 kits/shorts-lab/clip-manifest.mjs
          git diff --cached --check
          git diff --cached --name-only
          git commit -m "Refresh four screenshot-grounded Motion Atlas recordings"
          git push origin HEAD:codex/motion-atlas-carousel-focus-20261122
      - name: Preserve failed capture diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: motion-atlas-four-studies-diagnostics
          path: |
            kits/shorts-lab/assets/071.mp4
            kits/shorts-lab/assets/072.mp4
            kits/shorts-lab/assets/073.mp4
            kits/shorts-lab/assets/074.mp4
            kits/shorts-lab/clip-manifest.mjs
          retention-days: 7
