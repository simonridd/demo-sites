name: Recover validated Motion Atlas recordings
on:
  push:
    branches:
      - codex/motion-atlas-squishy-toggle-20261122
    paths:
      - .github/workflows/motion-atlas-stage-controls.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: motion-atlas-recover-videos
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Check out latest screenshot-led branch
        uses: actions/checkout@v4
        with:
          ref: codex/motion-atlas-squishy-toggle-20261122
          persist-credentials: true
      - name: Recover eleven browser-verified recordings from successful capture stage
        uses: actions/download-artifact@v4
        with:
          name: motion-atlas-stage-controls-failure
          run-id: 45074299642
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: kits/shorts-lab/assets
      - name: Verify recovered files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path('kits/shorts-lab/assets')
          ids=[52,57,60,61,65,66,67,68,69,76,77]
          assert all((root/f'{i:03d}.mp4').exists() for i in ids), 'Missing recovered clip'
          print('Recovered',len(ids),'videos',sum((root/f'{i:03d}.mp4').stat().st_size for i in ids),'bytes')
          PY
      - name: Install ffprobe for independent asset validation
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Recreate manifest from the 64 actual MP4 files and validate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import runpy, subprocess
          lib=runpy.run_path('tools/capture-motion-atlas.py',run_name='imported')
          actual=lib['write_manifest'](lib['catalogue']())
          assert actual==64, actual
          root=Path('kits/shorts-lab/assets')
          files=list(root.glob('[0-9][0-9][0-9].mp4'))
          assert len(files)==64,len(files)
          for idx in [52,57,60,61,65,66,67,68,69,76,77]:
              p=root/f'{idx:03d}.mp4'
              result=subprocess.run(['ffprobe','-v','error','-select_streams','v:0',
                  '-show_entries','stream=width,height','-of','csv=p=0',str(p)],
                  capture_output=True,text=True,check=True)
              assert result.stdout.strip()=='512,320',(idx,result.stdout)
          print('Confirmed 64 manifest entries, 64 MP4 files, and 11 new 512x320 recordings')
          PY
      - name: Verify repository regression suite
        run: node --test *.test.cjs quote/*.test.cjs
      - name: Commit only recovered recordings and manifest without losing concurrent changes
        run: |
          set -euxo pipefail
          git config user.name "motion-atlas-capture[bot]"
          git config user.email "motion-atlas-capture[bot]@users.noreply.github.com"
          git add kits/shorts-lab/assets/052.mp4 kits/shorts-lab/assets/057.mp4 kits/shorts-lab/assets/060.mp4 kits/shorts-lab/assets/061.mp4 kits/shorts-lab/assets/065.mp4 kits/shorts-lab/assets/066.mp4 kits/shorts-lab/assets/067.mp4 kits/shorts-lab/assets/068.mp4 kits/shorts-lab/assets/069.mp4 kits/shorts-lab/assets/076.mp4 kits/shorts-lab/assets/077.mp4 kits/shorts-lab/clip-manifest.mjs
          git diff --cached --check
          git commit -m "Restore 11 validated Motion Atlas side-by-side recordings"
          git fetch origin codex/motion-atlas-squishy-toggle-20261122
          git rebase origin/codex/motion-atlas-squishy-toggle-20261122
          git push origin HEAD:codex/motion-atlas-squishy-toggle-20261122
